version: "3.9"

services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        APP_URL: ${APP_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        BREVO_API_KEY: ${BREVO_API_KEY}
        BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
        SOKETI_APP_ID: ${SOKETI_APP_ID}
        SOKETI_KEY: ${SOKETI_KEY}
        SOKETI_SECRET: ${SOKETI_SECRET}
        SOKETI_HOST: ${SOKETI_HOST}
        SOKETI_PORT: ${SOKETI_PORT}
        SOKETI_USE_TLS: ${SOKETI_USE_TLS}
        NEXT_PUBLIC_SOKETI_KEY: ${NEXT_PUBLIC_SOKETI_KEY}
        NEXT_PUBLIC_SOKETI_HOST: ${NEXT_PUBLIC_SOKETI_HOST}
        NEXT_PUBLIC_SOKETI_PORT: ${NEXT_PUBLIC_SOKETI_PORT}
        NEXT_PUBLIC_SOKETI_USE_TLS: ${NEXT_PUBLIC_SOKETI_USE_TLS}
        SKIP_ENV_VALIDATION: ${SKIP_ENV_VALIDATION:-true}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@iwo40o84w0wgo8k4k8s0c4o0:5432/reconex?schema=public
      RECONEX_STORAGE_DIR: /app/storage/uploads
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      APP_URL: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - reconex-uploads:/app/storage/uploads
    # Use the start.sh script which handles database connection retries and migrations
    # The script waits for the database to be ready before running migrations and starting the server
    command: ["sh", "/app/start.sh"]
    expose:
      - "3000"
    restart: always

volumes:
  reconex-uploads:
    driver: local