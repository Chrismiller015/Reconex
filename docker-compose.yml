version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: reconex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reconex}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reconex}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        APP_URL: ${APP_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        BREVO_API_KEY: ${BREVO_API_KEY}
        BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
        SOKETI_APP_ID: ${SOKETI_APP_ID}
        SOKETI_KEY: ${SOKETI_KEY}
        SOKETI_SECRET: ${SOKETI_SECRET}
        SOKETI_HOST: ${SOKETI_HOST}
        SOKETI_PORT: ${SOKETI_PORT}
        SOKETI_USE_TLS: ${SOKETI_USE_TLS}
        NEXT_PUBLIC_SOKETI_KEY: ${NEXT_PUBLIC_SOKETI_KEY}
        NEXT_PUBLIC_SOKETI_HOST: ${NEXT_PUBLIC_SOKETI_HOST}
        NEXT_PUBLIC_SOKETI_PORT: ${NEXT_PUBLIC_SOKETI_PORT}
        NEXT_PUBLIC_SOKETI_USE_TLS: ${NEXT_PUBLIC_SOKETI_USE_TLS}
        SKIP_ENV_VALIDATION: ${SKIP_ENV_VALIDATION:-true}
    container_name: reconex-app
    # Rootless Podman uses a user namespace; container "root" maps to your host user.
    # This avoids Next/Turbopack lockfile permission issues with the bind mount.
    user: "0:0"
    depends_on:
      - db
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reconex}?schema=public
      NEXTAUTH_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"
      RECONEX_MAX_UPLOAD_BYTES: ${RECONEX_MAX_UPLOAD_BYTES:-52428800}
      RECONEX_STORAGE_DIR: ${RECONEX_STORAGE_DIR:-/app/.uploads}
    ports:
      - "3000:3000"
    volumes:
      # Podman on Fedora/Bazzite typically needs SELinux relabeling for bind mounts.
      - .:/app:Z
    command:
      [
        "sh",
        "-lc",
        "set -euo pipefail; mkdir -p \"${RECONEX_STORAGE_DIR:-/app/.uploads}\"; i=0; until npx prisma migrate deploy; do i=$((i+1)); if [ \"$i\" -ge 30 ]; then echo \"Prisma migrate failed after retries\" >&2; exit 1; fi; echo \"Waiting for db / applying migrations (attempt $i)...\"; sleep 2; done; npm run dev",
      ]
    stdin_open: true
    tty: true

volumes:
  postgres-data:
